<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https://greenmd.app https://greenmd-asset.local;
               font-src 'self';
               connect-src 'none';
               form-action 'none';
               base-uri 'none'" />
<title>GreenMD</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <div id="menubar" class="menubar" role="menubar" aria-label="Main menu"></div>

    <div class="body">
      <aside id="sidebar" class="sidebar" data-zoom-scope="tree" hidden>
        <div id="workspaceSections" class="ws-sections"></div>
      </aside>

      <div id="sidebarDivider" class="body-divider" hidden
           role="separator" aria-orientation="vertical" aria-label="Resize file list"></div>

      <div id="panes" class="panes"></div>

      <div id="outlineDivider" class="body-divider"
           role="separator" aria-orientation="vertical" aria-label="Resize outline"></div>

      <aside class="pane-outline" data-zoom-scope="outline">
        <header class="panehead">
          <span id="outlineTitle" class="panehead-title">Outline</span>
          <button class="zoom-badge" type="button" data-zoom-badge
                  title="Reset text size to 100%" aria-label="Reset outline text size"></button>
        </header>
        <div id="outline" class="outline" data-zoom-target aria-label="Document outline"></div>
      </aside>
    </div>

    <div id="findBar" class="findbar" hidden>
      <input id="findInput" class="findbar-input" type="text" spellcheck="false"
             placeholder="Find in document" aria-label="Find in document" />
      <span id="findCount" class="findbar-count"></span>
      <button id="findPrev" class="icon-button" type="button" title="Previous (Shift+Enter)" aria-label="Previous match">&#8593;</button>
      <button id="findNext" class="icon-button" type="button" title="Next (Enter)" aria-label="Next match">&#8595;</button>
      <span id="findScope" class="findbar-scope"></span>
      <button id="findClose" class="icon-button" type="button" title="Close (Esc)" aria-label="Close find">&times;</button>
    </div>

    <div class="status">
      <button id="openFolder" class="status-action" type="button" title="Ctrl+K">Open folder</button>
      <span id="pulse" class="pulse" aria-hidden="true"></span>
      <span id="statusText"></span>
      <span id="statusRight" class="status-right"></span>
      <button id="toggleSidebar" class="panel-toggle" type="button" title="Show or hide the file list (Ctrl+B)">Files</button>
      <button id="toggleOutline" class="panel-toggle" type="button" title="Show or hide the outline (Ctrl+Shift+O)">Outline</button>
      <button id="swapPanels" class="panel-toggle" type="button" title="Swap the left and right panels">Swap sides</button>
    </div>
  </div>

  <div id="aboutBox" class="quick" hidden>
    <div class="quick-box about-box" role="dialog" aria-labelledby="aboutName">
      <div class="about-head">
        <div class="about-mark" aria-hidden="true">MD</div>
        <div>
          <div id="aboutName" class="about-name">GreenMD</div>
          <div id="aboutTag" class="about-tag">A dark-mode markdown viewer for Windows</div>
        </div>
      </div>
      <dl id="aboutFacts" class="about-facts"></dl>
      <div id="aboutDeps" class="about-deps"></div>
      <div class="exit-actions">
        <button id="aboutCopy" class="exit-button" type="button">Copy details</button>
        <button id="aboutClose" class="exit-button primary" type="button">Close</button>
      </div>
    </div>
  </div>

  <div id="exitPrompt" class="quick" hidden>
    <div class="quick-box exit-box" role="alertdialog" aria-labelledby="exitTitle">
      <div id="exitTitle" class="exit-title">Unsaved changes</div>
      <div id="exitList" class="exit-list"></div>
      <div class="exit-actions">
        <button id="exitSave" class="exit-button primary" type="button">Save all and close</button>
        <button id="exitDiscard" class="exit-button danger" type="button">Discard and close</button>
        <button id="exitCancel" class="exit-button" type="button">Keep editing</button>
      </div>
    </div>
  </div>

  <div id="quickOpen" class="quick" hidden>
    <div class="quick-box">
      <input id="quickInput" class="quick-input" type="text" spellcheck="false"
             placeholder="Go to file" aria-label="Go to file" />
      <div id="quickList" class="quick-list"></div>
    </div>
  </div>

  <script src="/highlight.js"></script>
  <script src="/zoom.js"></script>
  <script src="/layout.js"></script>
  <script src="/workspace.js"></script>
  <script src="/find.js"></script>
  <script src="/editor.js"></script>
  <script src="/panels.js"></script>
  <script src="/menu.js"></script>
  <script src="/app.js"></script>
</body>
</html>
