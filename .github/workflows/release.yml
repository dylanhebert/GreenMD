name: Release

# Publishes downloadable builds when a version tag is pushed. Run it by hand first
# (workflow_dispatch) if you want to check the artifacts before tagging.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The suite catches the failure mode a build cannot: a JavaScript exception
      # leaves a blank window while the process stays perfectly healthy.
      - name: Install test tooling
        run: npm install --prefix tests

      - name: Lint sources
        run: node tests/lint-sources.mjs

      # Vendored code is committed rather than fetched, which only means anything if
      # the file still matches what was reviewed.
      - name: Verify vendored dependencies
        run: node tests/verify-vendor.mjs

      - name: Run UI tests
        run: node tests/ui-test.mjs

      - name: Build
        run: dotnet build GreenMD.sln -c Release

      # Self-contained: runs on a machine with no .NET installed, which is the point
      # of a download-and-run release.
      - name: Publish self-contained
        run: >
          dotnet publish GreenMD/GreenMD.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/self-contained

      # Framework-dependent: a few MB for machines that already have the .NET
      # Desktop Runtime.
      - name: Publish framework-dependent
        run: >
          dotnet publish GreenMD/GreenMD.csproj
          -c Release -r win-x64 --self-contained false
          -o publish/framework-dependent

      - name: Package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/', '' } else { 'dev' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/self-contained/*      -DestinationPath "artifacts/GreenMD-$version-win-x64-standalone.zip"
          Compress-Archive -Path publish/framework-dependent/* -DestinationPath "artifacts/GreenMD-$version-win-x64-needs-dotnet.zip"
          Get-ChildItem artifacts | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: greenmd-builds
          path: artifacts/*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
