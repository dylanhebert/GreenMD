<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data: https://mdviewer.app https://mdasset.local;
               font-src 'self';
               connect-src 'none';
               form-action 'none';
               base-uri 'none'" />
<title>MarkdownViewer</title>
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <div class="body">
      <aside id="sidebar" class="sidebar" data-zoom-scope="tree" hidden>
        <header class="panehead">
          <span id="workspaceName" class="panehead-title"></span>
          <div class="panehead-actions">
            <button class="zoom-badge" type="button" data-zoom-badge
                    title="Reset text size to 100%" aria-label="Reset file list text size"></button>
            <button id="closeWorkspace" class="icon-button" type="button"
                    title="Close workspace" aria-label="Close workspace">×</button>
          </div>
        </header>
        <div id="tree" class="tree" data-zoom-target aria-label="Workspace files"></div>
      </aside>

      <div id="panes" class="panes"></div>

      <aside class="pane-outline" data-zoom-scope="outline">
        <header class="panehead">
          <span id="outlineTitle" class="panehead-title">Outline</span>
          <button class="zoom-badge" type="button" data-zoom-badge
                  title="Reset text size to 100%" aria-label="Reset outline text size"></button>
        </header>
        <div id="outline" class="outline" data-zoom-target aria-label="Document outline"></div>
      </aside>
    </div>

    <div class="status">
      <span id="pulse" class="pulse" aria-hidden="true"></span>
      <span id="statusText"></span>
      <span id="statusRight" class="status-right"></span>
      <button id="openFolder" class="status-action" type="button" title="Ctrl+K">Open folder</button>
      <button id="assocButton" class="status-action" type="button" hidden>Set as default .md viewer</button>
    </div>
  </div>

  <div id="quickOpen" class="quick" hidden>
    <div class="quick-box">
      <input id="quickInput" class="quick-input" type="text" spellcheck="false"
             placeholder="Go to file" aria-label="Go to file" />
      <div id="quickList" class="quick-list"></div>
    </div>
  </div>

  <script src="/highlight.js"></script>
  <script src="/zoom.js"></script>
  <script src="/layout.js"></script>
  <script src="/workspace.js"></script>
  <script src="/app.js"></script>
</body>
</html>
